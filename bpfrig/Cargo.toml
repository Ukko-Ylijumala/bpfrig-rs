[package]
name = "bpfrig"
description = "Shared loading plumbing for aya-based eBPF tools: BTF offsets, pins, kprobe tables, the bpf LSM, pinned maps, batch map ops, XDP and TC"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
publish.workspace = true
rust-version = "1.87"
keywords = ["ebpf", "bpf", "aya"]

[dependencies]
anyhow.workspace = true
aya.workspace = true
libc.workspace = true
nix.workspace = true
strum.workspace = true

[features]
# XDP and TC helpers (interface facts, the XDP mode check, a TC hook that
# cleans up its clsact qdisc). Only the network tools need them.
net = []
