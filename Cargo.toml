[workspace]
resolver = "3"
members = ["bpfrig", "bpfrig-build", "bpfrig-ebpf"]

[workspace.package]
version = "0.1.1"
authors = ["Mikko Tanner <mikko.tanner@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ukko-Ylijumala/bpfrig-rs"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
aya = "0.14"
aya-build = "0.2"
aya-ebpf = "0.2"
cargo_metadata = { version = "0.23", default-features = false }
libc = "0.2"
nix = { version = "0.30", features = ["fs", "mount", "time", "user"] }
strum = { version = "0.27", features = ["derive"] }
